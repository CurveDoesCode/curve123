<!DOCTYPE html>
<html>
  <head>
    <title>Adam's Website</title>
    <style>
      .icon-banana {
        width: 75px;
        height: 75px;
        border-radius: 50px;
        object-fit: cover;
        object-position: center;
        vertical-align: middle;
        margin-right: 10px;
        margin-top: 0px;
        margin-bottom: 0px;
        margin-left: 0px;
        border-color: black;
        border-style: solid;
        border-width: 2px;
        box-shadow: 0px 3px 5px black;
        transition: box-shadow 0.25s, opacity 0.25s, width 0.25s, height 0.25s, margin-right 0.25s;
      }

      .icon-banana:hover {
        box-shadow: 0px 3px 7px black;
        opacity: 0.8;
        width: 90px;
        height: 90px;
        margin-right: 25px;
      }

      .icon-banana:active {
        opacity: 0.5;
        width: 70px;
        height: 70px;
        margin-right: 10px;
      }

      .input-tweet {
        font-family: Arial;
        font-size: 18px;
        border-radius: 15px;
        padding-top: 8px;
        padding-bottom: 8px;
        padding-right: 15px;
        padding-left: 15px;
        margin-top: 0px;
        margin-bottom: 0px;
        margin-right: 10px;
        margin-left: 0px;
        vertical-align: middle;
        width: 300px;
        border: none;
      }

      .button-tweet {
        background-color: rgb(87, 87, 255);
        font-family: Arial;
        font-size: 18px;
        color: white;
        border-radius: 36px;
        margin-top: 0px;
        margin-bottom: 0px;
        margin-right: 0px;
        margin-left: 0px;
        padding-top: 11px;
        padding-bottom: 11px;
        padding-right: 17px;
        padding-left: 17px;
        vertical-align: middle;
        border: none;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0px 1px 5px black;
        transition: opacity 0.15s;
      }

      .button-tweet:hover {
        opacity: 0.7;
      }
      .button-tweet:active {
        opacity: 0.4;
      }

      .text-rainbow {
        text-align: center;
        font-family: Arial;
        font-size: 36px;
        font-weight: bold;
        color: black;
        word-spacing: 10px;
        margin-top: 0px;
        margin-bottom: 0px;
        margin-right: 0px;
        margin-left: 0px;
        transition: font-size 0.25s, color 0.25s, padding 0.25s;
        padding-top: 20px;
        padding-bottom: 20px;
        padding-right: 10px;
        padding-left: 10px;
      }

      .text-rainbow:hover {
        padding-top: 40px;
        padding-bottom: 40px;
        padding-left: 60px;
        padding-right: 60px;
      }
      .R:hover {
        font-size: 72px;
        color: red;
      }
      .R:active {
        font-size: 36px;
        color: orange;
      }

      .A:hover {
        font-size: 72px;
        color: orange;
      }
      .A:active {
        font-size: 36px;
        color: yellow;
      }
      .I:hover {
        font-size: 72px;
        color: yellow;
      }
      .I:active {
        font-size: 36px;
        color: green;
      }
      .N:hover {
        font-size: 72px;
        color: green;
      }
      .N:active {
        font-size: 36px;
        color: blue;
      }
      .B:hover {
        font-size: 72px;
        color: blue;
      }
      .B:active {
        font-size: 36px;
        color: indigo;
      }
      .O:hover {
        font-size: 72px;
        color: indigo;
      }
      .O:active {
        font-size: 36px;
        color: violet;
      }
      .W:hover {
        font-size: 72px;
        color: violet;
      }
      .W:active {
        font-size: 36px;
        color: red;
      }

      .link-facebook {
        font-family: Arial;
        font-size: 22px;
        cursor: pointer;
      }
    </style>
  </head>
  
  <body>
    <img class = "icon-banana" src = "banana.jpeg">
    <input class = "input-tweet" type = "text" placeholder = "I love food!">
    <button class = "button-tweet">
      Tweet
    </button>
    <p class = "text-rainbow"> <span class = "R"> R </span> <span class = "A"> A </span> <span class = "I"> I </span>
    <span class = "N"> N </span> <span class = "B"> B </span> <span class = "O"> O </span> <span class = "W"> W </span> </p>
    <a class = "link-facebook" href = "https://www.facebook.com/profile.php?id=61583958308134" target = "_blank" > Adam's Facebook </a>
  </body>
</html>
